name: Auto-update lunch map

on:
  schedule:
    - cron: '40 1 * * 1-5'  # 한국 시간 평일 오전 10시 40분
  repository_dispatch:
    types: [update_lunch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ★ 이 부분이 추가되어야 깃허브 서버에서 OCR(텍스트 인식)을 할 수 있습니다!
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Set up Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run lunch script with Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          python lunchmapnew.py

      - name: Commit and push generated html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gasan_lunch_map.html
          git commit -m "Auto-update lunch map for today" || exit 0
          git push
