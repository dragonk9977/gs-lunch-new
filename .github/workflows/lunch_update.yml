name: Auto-update lunch map

on:
  schedule:
    # 평일(월~금) 오전 9시 30분 ~ 12시 사이 20분 간격 (KST 기준)
    - cron: '30,50 0 * * 1-5'     # KST 09:30, 09:50
    - cron: '10,30,50 1 * * 1-5'  # KST 10:10, 10:30, 10:50
    - cron: '10,30,50 2 * * 1-5'  # KST 11:10, 11:30, 11:50
    - cron: '0 3 * * 1-5'         # KST 12:00
  repository_dispatch:
    types: [update_lunch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Set up Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run lunch script with Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          python lunchmapnew.py

      - name: Commit and push generated html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gasan_lunch_map.html
          git commit -m "Auto-update lunch map for today" || exit 0
          git push
