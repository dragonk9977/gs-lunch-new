name: Auto-update lunch map

on:
  schedule:
    - cron: '30 1 * * 1-5'
  repository_dispatch:
    types: [update_lunch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 1. 오정 OCR 인식을 위한 시스템 프로그램(Tesseract) 설치
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract  # 파이썬 OCR 라이브러리 추가 설치

      - name: Set up Virtual Display (Xvfb)
        run: |
          sudo apt-get install -y xvfb

      - name: Run lunch script with Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          python lunchmapnew.py

      - name: Commit and push generated html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gasan_lunch_map.html
          git commit -m "Auto-update lunch map for today" || exit 0
          git push
