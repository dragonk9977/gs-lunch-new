name: Update Lunch Menu

on:
  schedule:
    - cron: '3,13,23,33,43,53 0-1 * * 1-5'
    - cron: '3,13,23,33,43 2 * * 1-5'
  workflow_dispatch:

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lunchmap script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python lunchmapnew.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git diff --staged --quiet || git commit -m "Auto-update lunch menu"
          git push
