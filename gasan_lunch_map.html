<style>
@font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
}
* {
    font-family: 'KakaoBigFont', sans-serif !important;
}

.leaflet-popup-close-button {
    width: 40px !important;
    height: 40px !important;
    padding: 8px !important;
    font-size: 26px !important;
    color: #e74c3c !important;
    font-weight: bold !important;
}

.leaflet-popup-content-wrapper {
    background: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4) !important;
    border-radius: 12px !important;
}

/* 우측 상단 '지도 정위치' 버튼 */
.reset-map-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 99999;
    background: #ffffff;
    border: 3px solid #000000;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    color: #111;
}

/* 우측 상단 '메뉴 한번에 보기 / 닫기' 버튼 */
.toggle-all-btn {
    position: fixed;
    top: 70px;
    right: 15px;
    z-index: 99999;
    background: #111111;
    border: 3px solid #000000;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    color: #ffffff;
    text-align: center;
}
.toggle-all-btn:hover {
    background: #333333;
}
</style>

<script>
let initialCenter = null;
let initialZoom = null;
let mapObj = null;
let allPopupsOpen = false;

window.addEventListener('load', function() {
    setTimeout(function() {
        for (var key in window) {
            if (window[key] && window[key] instanceof L.Map) {
                mapObj = window[key];
                window.mapObj = mapObj;
                initialCenter = mapObj.getCenter();
                initialZoom = mapObj.getZoom();

                // 1. 지도 정위치 버튼 기능
                var btn = document.createElement('div');
                btn.innerHTML = '🗺️ 지도 정위치';
                btn.className = 'reset-map-btn';
                btn.onclick = function() {
                    if (mapObj) {
                        mapObj.eachLayer(function(layer) {
                            if (layer instanceof L.Marker && layer.getPopup()) {
                                layer.closePopup();
                            }
                        });
                        allPopupsOpen = false;
                        var toggleBtn = document.querySelector('.toggle-all-btn');
                        if (toggleBtn) toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
                        if (initialCenter && initialZoom) {
                            mapObj.setView(initialCenter, initialZoom, {animate: false});
                        }
                    }
                };
                document.body.appendChild(btn);

                // 2. 메뉴 한번에 보기 / 닫기 토글 버튼 기능 (화면 고정형 5개 슬림 가로 정렬)
                var toggleBtn = document.createElement('div');
                toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
                toggleBtn.className = 'toggle-all-btn';
                toggleBtn.onclick = function() {
                    if (!mapObj) return;
                    if (!allPopupsOpen) {
                        // 모든 팝업 열기 (지도 이동 없음)
                        mapObj.eachLayer(function(layer) {
                            if (layer instanceof L.Marker && layer.getPopup()) {
                                layer.openPopup();
                            }
                        });
                        
                        // 5개 팝업을 화면 상단(top: 55px)에 바짝 붙이고, 겹치지 않게 가로 폭 자동 균등 배분
                        setTimeout(function() {
                            var popups = document.querySelectorAll('.leaflet-popup');
                            if (popups.length > 0) {
                                var screenW = window.innerWidth;
                                var margin = 10;
                                var totalW = screenW - (margin * 2);
                                var popupW = Math.floor((totalW - (8 * (popups.length - 1))) / popups.length);
                                if (popupW < 220) popupW = 220; // 최소 너비 보장

                                popups.forEach(function(p, index) {
                                    p.style.position = 'fixed';
                                    p.style.top = '55px'; // 상단에 바짝 붙여서 세로 잘림 방지
                                    
                                    var contentWrapper = p.querySelector('.leaflet-popup-content-wrapper');
                                    if (contentWrapper) {
                                        contentWrapper.style.width = popupW + 'px';
                                    }
                                    var content = p.querySelector('.leaflet-popup-content');
                                    if (content) {
                                        content.style.width = (popupW - 20) + 'px';
                                        content.style.margin = '10px';
                                    }
                                    
                                    var leftPos = margin + (index * (popupW + 8));
                                    p.style.left = leftPos + 'px';
                                    p.style.transform = 'none';
                                });
                            }
                        }, 50);

                        toggleBtn.innerHTML = '❌ 메뉴 닫기';
                        allPopupsOpen = true;
                    } else {
                        // 모든 팝업 닫기
                        mapObj.eachLayer(function(layer) {
                            if (layer instanceof L.Marker && layer.getPopup()) {
                                layer.closePopup();
                            }
                        });
                        toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
                        allPopupsOpen = false;
                        if (initialCenter && initialZoom) {
                            mapObj.setView(initialCenter, initialZoom, {animate: false});
                        }
                    }
                };
                document.body.appendChild(toggleBtn);

                // 3. 개별 팝업이 닫힐 때 처리
                mapObj.on('popupclose', function() {
                    setTimeout(function() {
                        var anyOpen = false;
                        mapObj.eachLayer(function(layer) {
                            if (layer instanceof L.Marker && layer.getPopup() && layer.isPopupOpen()) {
                                anyOpen = true;
                            }
                        });
                        if (!anyOpen) {
                            allPopupsOpen = false;
                            var toggleBtn = document.querySelector('.toggle-all-btn');
                            if (toggleBtn) toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
                            
                            // 스타일 초기화
                            var popups = document.querySelectorAll('.leaflet-popup');
                            popups.forEach(function(p) {
                                p.style.position = '';
                                p.style.top = '';
                                p.style.left = '';
                                p.style.transform = '';
                                var cw = p.querySelector('.leaflet-popup-content-wrapper');
                                if (cw) cw.style.width = '';
                                var c = p.querySelector('.leaflet-popup-content');
                                if (c) { c.style.width = ''; c.style.margin = ''; }
                            });
                            if (initialCenter && initialZoom) {
                                mapObj.setView(initialCenter, initialZoom, {animate: false});
                            }
                        }
                    }, 150);
                });

                break;
            }
        }
    }, 400);
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        if (mapObj) {
            mapObj.eachLayer(function(layer) {
                if (layer instanceof L.Marker && layer.getPopup()) {
                    layer.closePopup();
                }
            });
            allPopupsOpen = false;
            var toggleBtn = document.querySelector('.toggle-all-btn');
            if (toggleBtn) toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
            var popups = document.querySelectorAll('.leaflet-popup');
            popups.forEach(function(p) {
                p.style.position = '';
                p.style.top = '';
                p.style.left = '';
                p.style.transform = '';
                var cw = p.querySelector('.leaflet-popup-content-wrapper');
                if (cw) cw.style.width = '';
                var c = p.querySelector('.leaflet-popup-content');
                if (c) { c.style.width = ''; c.style.margin = ''; }
            });
            if (initialCenter && initialZoom) {
                mapObj.setView(initialCenter, initialZoom, {animate: false});
            }
        }
    }
});
</script>
