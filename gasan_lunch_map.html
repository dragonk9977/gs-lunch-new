@font-face {

* {

}

.leaflet-popup-close-button {
    width: 40px !important;
    height: 40px !important;
    padding: 8px !important;
    font-size: 26px !important;
    color: #e74c3c !important;
    font-weight: bold !important;
}

.leaflet-popup-content-wrapper {
    background: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4) !important;
    border-radius: 12px !important;
}

/* 우측 상단 '지도 정위치' 버튼 */
.reset-map-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 99999;
    background: #ffffff;
    border: 3px solid #000000;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    color: #111;
}
.reset-map-btn:hover {
    background: #f0f0f0;
}
</style>

<script>
let initialCenter = null;
let initialZoom = null;
let mapObj = null;

function resetMapView() {
    if (mapObj && initialCenter && initialZoom) {
        mapObj.closePopup();
        mapObj.setView(initialCenter, initialZoom);
    }
}

window.addEventListener('load', function() {
    setTimeout(function() {
        for (var key in window) {
            if (window[key] && window[key] instanceof L.Map) {
                mapObj = window[key];
                window.mapObj = mapObj;
                initialCenter = mapObj.getCenter();
                initialZoom = mapObj.getZoom();

                // 1. 우측 상단 '지도 정위치' 버튼 기능
                var btn = document.createElement('div');
                btn.innerHTML = '🗺️ 지도 정위치';
                btn.className = 'reset-map-btn';
                btn.onclick = function() {
                    resetMapView();
                };
                document.body.appendChild(btn);

                // 2. 팝업창을 닫을 때(X표 클릭 또는 지도 여백 클릭 시) 원래 위치로 확실하게 복구
                mapObj.on('popupclose', function() {
                    setTimeout(function() {
                        var openPopups = document.querySelectorAll('.leaflet-popup');
                        if (openPopups.length === 0) {
                            resetMapView();
                        }
                    }, 200);
                });

                break;
            }
        }
    }, 400);
});

// 3. ESC 키를 눌렀을 때도 메뉴가 닫히면서 지도 정위치로 복구
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        resetMapView();
    }
});
</script>
