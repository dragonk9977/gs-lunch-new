<body>
    
    
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
@font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
}
* {
    font-family: 'KakaoBigFont', sans-serif !important;
}

.leaflet-popup-close-button {
    width: 36px !important;
    height: 36px !important;
    padding: 6px !important;
    font-size: 22px !important;
    color: #e74c3c !important;
    font-weight: bold !important;
}

.leaflet-popup-content-wrapper {
    background: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4) !important;
    border-radius: 12px !important;
}

/* 우측 상단 '지도 정위치' 버튼 */
.reset-map-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 99999;
    background: #ffffff;
    border: 3px solid #000000;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    color: #111;
}
.reset-map-btn:hover {
    background: #f0f0f0;
}

/* 우측 상단 '메뉴 한번에 보기 / 닫기' 버튼 */
.toggle-all-btn {
    position: fixed;
    top: 70px;
    right: 15px;
    z-index: 99999;
    background: #111111;
    border: 3px solid #000000;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 15px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    color: #ffffff;
    text-align: center;
}
.toggle-all-btn:hover {
    background: #333333;
}

/* 대시보드 모달 스타일 (PC 및 모바일 모두 가로 스와이프/스크롤 구조 유지) */
#dashboardModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.65);
    z-index: 9999999;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding: 15px;
}

.dashboard-container {
    background: #f4f6f8;
    border: 5px solid #111111;
    width: 96vw;
    max-width: 1550px;
    height: 90vh;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
}

/* 5개 카드가 가로로 나란히 배치되고 모바일에서도 좌우 스크롤 가능 */
.dashboard-grid {
    display: flex;
    flex-direction: row;
    gap: 15px;
    width: 100%;
    height: calc(100% - 50px);
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
}

@media (max-width: 900px) {
    .dashboard-container {
        width: 98vw;
        height: 94vh;
        padding: 12px;
    }
}
</style>

<script>
let initialCenter = null;
let initialZoom = null;
let mapObj = null;

function resetMapView() {
    if (mapObj && initialCenter && initialZoom) {
        mapObj.closePopup();
        mapObj.setView(initialCenter, initialZoom);
    }
}

function toggleDashboard(show) {
    var modal = document.getElementById('dashboardModal');
    var btn = document.querySelector('.toggle-all-btn');
    if (show) {
        if (mapObj) mapObj.closePopup();
        modal.style.display = 'flex';
        if (btn) btn.innerHTML = '❌ 메뉴 닫기';
    } else {
        modal.style.display = 'none';
        if (btn) btn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
        resetMapView();
    }
}

window.addEventListener('load', function() {
    setTimeout(function() {
        for (var key in window) {
            if (window[key] && window[key] instanceof L.Map) {
                mapObj = window[key];
                window.mapObj = mapObj;
                initialCenter = mapObj.getCenter();
                initialZoom = mapObj.getZoom();

                // 1. 지도 정위치 버튼 생성
                var resetBtn = document.createElement('div');
                resetBtn.innerHTML = '🗺️ 지도 정위치';
                resetBtn.className = 'reset-map-btn';
                resetBtn.onclick = function() {
                    toggleDashboard(false);
                    resetMapView();
                };
                document.body.appendChild(resetBtn);

                // 2. 전체 메뉴 보기 토글 버튼 생성
                var toggleBtn = document.createElement('div');
                toggleBtn.innerHTML = '📋 메뉴 한번에 보기 / 닫기';
                toggleBtn.className = 'toggle-all-btn';
                toggleBtn.onclick = function() {
                    var modal = document.getElementById('dashboardModal');
                    if (modal.style.display === 'flex') {
                        toggleDashboard(false);
                    } else {
                        toggleDashboard(true);
                    }
                };
                document.body.appendChild(toggleBtn);

                break;
            }
        }
    }, 400);
});

// ESC 키를 누르면 모달 창 닫기
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        toggleDashboard(false);
    }
});

// 모달 바깥 배경 클릭 시 닫기
window.addEventListener('click', function(e) {
    var modal = document.getElementById('dashboardModal');
    if (e.target === modal) {
        toggleDashboard(false);
    }
